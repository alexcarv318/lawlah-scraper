[project]
name = "lexrag-scraper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.40.0",
    "fastapi>=0.128.0",
    "uvicorn>=0.35.0",
    "alembic>=1.18.5",
    "beautifulsoup4>=4.15.0",
    "datasets>=5.0.1",
    "httpx>=0.28.1",
    "lxml>=6.1.2",
    "openai>=3.6.0",
    "pgvector>=0.4.0",
    "playwright>=1.62.0",
    "protobuf>=7.36.1",
    "psycopg[binary]>=3.2.0",
    "pyarrow>=25.0.1",
    "pydantic-settings>=2.14.2",
    "scikit-learn>=1.9.0",
    "sentencepiece>=0.2.2",
    "sqlalchemy>=2.0.51",
    "tiktoken>=0.14.0",
    "torch>=2.13.0",
    "transformers>=5.16.1",
]

[dependency-groups]
dev = [
    "boto3-stubs[ec2]>=1.40.0",
    "mypy>=2.3.0",
    "ruff>=0.16.0",
    "types-beautifulsoup4>=4.12.0.20250516",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
preview = true
extend-select = ["PLR6301"]
