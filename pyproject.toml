[project]
name = "lexrag-scraper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "lxml>=6.1.2",
    "openai>=3.6.0",
    "pgvector>=0.4.0",
    "playwright>=1.62.0",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0.51",
    "tiktoken>=0.14.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "ruff>=0.16.0",
    "types-beautifulsoup4>=4.12.0.20250516",
]

[tool.ruff.lint]
preview = true
extend-select = ["PLR6301"]
